# Render Blueprint for the TravelSphere backend (docs/BACKEND.md §14).
# Apply: Render dashboard → New → Blueprint → this repository. Values marked `sync: false` are asked for on first apply.
# The frontend stays on GitHub Pages; set the repo variable VITE_API_BASE_URL to <api URL>/api.

services:
  # Python risk-intelligence service. Private: reachable only from other services in this workspace.
  - type: pserv
    name: travelsphere-risk
    runtime: python
    plan: starter            # private services have no free plan
    rootDir: risk-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port 8001
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: RISK_ENV
        value: production
      - key: RISK_HOST
        value: 0.0.0.0
      - key: RISK_PORT
        value: "8001"
      - key: RISK_SERVICE_TOKEN
        generateValue: true
      # Exactly one instance runs the background jobs; keep this service at one instance.
      - key: RISK_SCHEDULER_ENABLED
        value: "true"
      - key: DATABASE_URL
        sync: false

  # Express API — the public entry point.
  - type: web
    name: travelsphere-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: AUTH_MODE
        value: supabase
      - key: CORS_ORIGINS
        value: https://hasishinfant.github.io
      - key: RISK_SERVICE_URL
        fromService:
          type: pserv
          name: travelsphere-risk
          property: hostport
      - key: RISK_SERVICE_TOKEN
        fromService:
          type: pserv
          name: travelsphere-risk
          envVarKey: RISK_SERVICE_TOKEN
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: LITEAPI_API_KEY
        sync: false
      - key: LITEAPI_ENV
        value: sandbox
