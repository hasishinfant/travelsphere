name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Type check
        run: npx tsc --noEmit

      - name: Build production assets
        run: npm run build
        env:
          # Public, browser-safe values only (Supabase anon key is protected by RLS).
          # Set them under Settings → Secrets and variables → Actions → Variables.
          # If unset, the app builds in guest/offline mode instead of failing.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

      - name: Verify no secrets in bundle
        run: |
          if grep -rEl "sk-(proj-)?[A-Za-z0-9_-]{20,}|service_role|LOCAL_JWT_SECRET|postgres(ql)?://" dist; then
            echo "::error::Possible secret found in build output"; exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './dist'

  # A separate job, as in GitHub's own Pages template: it starts on a fresh runner after the artifact is registered.
  # Deploying from the same job intermittently failed with 'No artifacts named "github-pages" were found'.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
